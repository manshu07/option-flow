# Rust port of server.journal.trackCardFollowThrough (manual crate, fast-anything workflow).
[package]
name = "fa_server_journal_trackcardfollowthrough"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "fa_server_journal_trackcardfollowthrough"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = false

[workspace]
