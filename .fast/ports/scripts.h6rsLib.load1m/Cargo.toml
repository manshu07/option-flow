# Rust port of scripts.h6rsLib.load1m, generated by fast-anything.
[package]
name = "fa_scripts_h6rslib_load1m"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "fa_scripts_h6rslib_load1m"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = false

# A crate of its own, even inside another Cargo workspace.
[workspace]
